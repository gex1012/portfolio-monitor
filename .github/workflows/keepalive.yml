name: Keep Streamlit app awake

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Open the app in a real browser until it renders
        env:
          APP_URL: https://portfolio-monitor-wfxhh2d4veil9nchccygxr.streamlit.app/
        run: |
          python - <<'PY'
          import os, time
          from playwright.sync_api import sync_playwright
          url = os.environ["APP_URL"]
          with sync_playwright() as p:
              b = p.chromium.launch()
              page = b.new_page()
              deadline = time.time() + 9 * 60
              while True:
                  page.goto(url, wait_until="domcontentloaded")
                  try:
                      # app is really running once the main container has content
                      page.wait_for_selector('[data-testid="stAppViewContainer"] [data-testid="stVerticalBlock"]', timeout=60_000)
                      print("app rendered:", page.title()); break
                  except Exception as e:
                      if time.time() > deadline:
                          raise SystemExit(f"app did not render in time: {e}")
                      print("still booting, retrying…"); time.sleep(20)
              time.sleep(15)   # hold the session briefly so it counts as traffic
              b.close()
          PY
